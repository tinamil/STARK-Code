name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Test
        run: npm test
      - name: Package
        # The extension ID stays oai-agent (so installs upgrade in place); only the file is named stark-code.
        run: npx --yes @vscode/vsce@3 package --out "stark-code-${GITHUB_REF_NAME#v}.vsix"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "STARK Code $GITHUB_REF_NAME" --generate-notes

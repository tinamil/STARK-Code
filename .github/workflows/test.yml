name: Tests
on:
  pull_request:
    # Docs-only changes don't need the test suite.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # Merges to main were already tested on their PR; run manually if ever needed.
  workflow_dispatch:
# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Panel tests run the real webview in headless Chromium (Linux only; skipped elsewhere).
      - name: Install dev dependencies and Chromium
        if: runner.os == 'Linux'
        run: npm ci && npx playwright install --with-deps chromium
      - name: Tests (PowerShell 7 for the script checker)
        run: npm test
        env:
          REQUIRE_POWERSHELL: '1'
          REQUIRE_UI: ${{ runner.os == 'Linux' && '1' || '' }}
      # Launches a real VS Code (downloaded by @vscode/test-electron) with the extension loaded.
      - name: Tests inside VS Code
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Script checker on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: node --test test/psreadonly.test.js
        env:
          REQUIRE_POWERSHELL: '1'
          OAI_AGENT_PWSH: powershell.exe
